<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Ayush Verma — Full-Stack Developer</title>
  <desc id="desc">A bold navy, teal and blue professional banner.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="48%" stop-color="#123A5A"/>
      <stop offset="100%" stop-color="#0A766E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#background)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>
  <circle cx="1088" cy="52" r="160" fill="#38BDF8" fill-opacity=".12"/>
  <circle cx="1044" cy="266" r="172" fill="#2DD4BF" fill-opacity=".13"/>
  <circle cx="869" cy="70" r="62" fill="#60A5FA" fill-opacity=".11"/>
  <path d="M0 262C200 206 324 334 519 264C717 193 866 212 1200 112V300H0Z" fill="#020617" fill-opacity=".20"/>
  <g filter="url(#shadow)">
    <rect x="760" y="83" width="298" height="48" rx="24" fill="#0F172A" fill-opacity=".77" stroke="#2DD4BF" stroke-opacity=".65"/>
    <circle cx="790" cy="107" r="8" fill="#2DD4BF"/>
    <text x="812" y="114" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing=".4">OPEN TO WORK</text>
  </g>
  <text x="76" y="116" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">Ayush Verma</text>
  <rect x="78" y="140" width="474" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="76" y="190" fill="#D5E8F2" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">FULL-STACK DEVELOPER</text>
  <text x="76" y="225" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="19">React  •  TypeScript  •  Node.js  •  MongoDB  •  PostgreSQL</text>
  <g transform="translate(76 250)">
    <rect width="126" height="30" rx="15" fill="#0F172A" fill-opacity=".66" stroke="#60A5FA" stroke-opacity=".55"/>
    <text x="63" y="21" text-anchor="middle" fill="#E0F2FE" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">MERN &amp; PERN</text>
    <rect x="140" width="166" height="30" rx="15" fill="#0F172A" fill-opacity=".66" stroke="#2DD4BF" stroke-opacity=".55"/>
    <text x="223" y="21" text-anchor="middle" fill="#CCFBF1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">BUILDING PRODUCTS</text>
  </g>
</svg>