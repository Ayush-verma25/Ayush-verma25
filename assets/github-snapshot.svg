<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">Ayush Verma's GitHub portfolio snapshot</title>
  <desc id="desc">A professionally styled snapshot of 47 public repositories and six featured full-stack applications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="52%" stop-color="#123A5A"/>
      <stop offset="100%" stop-color="#0A766E"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="310" rx="20" fill="url(#bg)"/>
  <path d="M0 250C180 175 344 320 556 251C760 184 928 232 1200 134V310H0Z" fill="#020617" fill-opacity=".22"/>
  <circle cx="1128" cy="44" r="132" fill="#60A5FA" fill-opacity=".11"/>
  <circle cx="1026" cy="288" r="164" fill="#2DD4BF" fill-opacity=".12"/>
  <text x="66" y="68" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800">GitHub Portfolio Snapshot</text>
  <rect x="66" y="85" width="390" height="4" rx="2" fill="url(#line)"/>
  <text x="66" y="119" fill="#B7CBD8" font-family="Arial, Helvetica, sans-serif" font-size="17">Public work and current full-stack focus</text>
  <g filter="url(#shadow)">
    <rect x="66" y="152" width="310" height="102" rx="16" fill="#0F172A" fill-opacity=".72" stroke="#60A5FA" stroke-opacity=".56"/>
    <text x="92" y="191" fill="#60A5FA" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="800">47</text>
    <text x="92" y="222" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Public repositories</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="404" y="152" width="310" height="102" rx="16" fill="#0F172A" fill-opacity=".72" stroke="#2DD4BF" stroke-opacity=".56"/>
    <text x="430" y="191" fill="#2DD4BF" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="800">6</text>
    <text x="430" y="222" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Featured full-stack apps</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="742" y="152" width="392" height="102" rx="16" fill="#0F172A" fill-opacity=".72" stroke="#A78BFA" stroke-opacity=".56"/>
    <text x="768" y="191" fill="#C4B5FD" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800">MERN • PERN • AI SaaS</text>
    <text x="768" y="222" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Commerce • Automation • Platforms</text>
  </g>
  <text x="66" y="286" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="15">React · TypeScript · Node.js · MongoDB · PostgreSQL · Prisma</text>
